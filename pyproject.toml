[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tomkl"
version = "0.1.0"
description = "Target-Oriented Multi-Behavior Knowledge Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2,<3",
    "numpy>=1.23,<3",
    "pandas>=1.5,<3",
    "tqdm>=4.64,<5",
]

[tool.setuptools]
packages = ["tomkl"]
